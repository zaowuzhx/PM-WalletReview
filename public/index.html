<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polymarket 地址画像</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header class="mast">
      <p class="kicker">Polymarket · Wallet Review</p>
      <h1>地址画像</h1>
      <p class="lede">输入一个 Polymarket 地址，查看最近 5,000 笔成交里的领域分布、买卖、持有时长和买入成本。</p>
    </header>

    <form id="search">
      <label for="address">地址</label>
      <div class="field">
        <input id="address" name="address" autocomplete="off" spellcheck="false" placeholder="0x… 或 polymarket.com/profile/0x…">
        <button id="submit" type="submit">分析</button>
      </div>
      <div class="form-row">
        <button id="example" type="button">用示例地址</button>
        <button id="cancel" type="button" hidden>取消</button>
      </div>
    </form>

    <p id="status" class="status" role="status" hidden></p>
    <div id="report" hidden></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
